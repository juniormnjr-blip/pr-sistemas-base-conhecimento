name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        shell: bash
        run: |
          GRADLE_VERSION=8.7
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release-keystore.p12
            cat > android/key.properties <<EOF
          storeFile=release-keystore.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=PKCS12
          EOF
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are incomplete; building a debug APK instead."
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK fallback
        shell: bash
        working-directory: android
        run: |
          if [ "${RELEASE_SIGNING_AVAILABLE:-false}" = "true" ]; then
            if gradle :app:assembleRelease; then
              echo "APK_VARIANT=release" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Release APK build failed; falling back to debug APK."
            rm -f key.properties release-keystore.p12
          fi

          gradle :app:assembleDebug
          echo "APK_VARIANT=debug" >> "$GITHUB_ENV"

      - name: Upload release APK
        if: env.APK_VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pr-sistemas-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        if: env.APK_VARIANT == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: pr-sistemas-apk
          path: android/app/build/outputs/apk/debug/*.apk
